name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend
        working-directory: client
        run: npm run build

  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Build Backend
        working-directory: server
        run: npm run build

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ahmad459/mern-boilerplate-frontend:latest
            ahmad459/mern-boilerplate-frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ahmad459/mern-boilerplate-backend:latest
            ahmad459/mern-boilerplate-backend:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - docker-build-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Deployment Tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y ansible rsync

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install \
            ansible.posix \
            community.docker

      - name: Prepare Deployment Credentials
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -eu

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

          printf '%s' "$ANSIBLE_VAULT_FILE" > ansible/vault.yml
          chmod 600 ansible/vault.yml

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault-password
          chmod 600 /tmp/vault-password

          printf '[mern_servers]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/ec2_key\n' \
            "$EC2_HOST" > /tmp/inventory.ini

      - name: Validate EC2 Host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST secret is empty."
            exit 1
          fi

          echo "Checking EC2 DNS..."
          getent hosts "$EC2_HOST"

      - name: Diagnose EC2 SSH Connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          echo "Checking SSH port 22 from GitHub runner..."

          if timeout 10 bash -c ':</dev/tcp/$1/22' _ "$EC2_HOST"; then
            echo "SSH port 22 is reachable."
          else
            echo "SSH port 22 is NOT reachable from GitHub runner."
            echo "Check EC2 security group, public IP, and network routing."
            exit 1
          fi

      - name: Retrieve EC2 SSH Host Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          if ssh-keyscan -T 10 -H "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/tmp/ssh-error.txt; then
            echo "SSH host key retrieved successfully."
          else
            echo "SSH host key retrieval failed."
            cat /tmp/ssh-error.txt
            exit 1
          fi

      - name: Verify SSH and Ansible Connection
        run: |
          set -eu

          ansible mern_servers \
            -i /tmp/inventory.ini \
            -m ansible.builtin.ping \
            --ssh-extra-args='-o ConnectTimeout=10'

      - name: Deploy MERN Application
        run: |
          set -eu

          ansible-playbook \
            -i /tmp/inventory.ini \
            --vault-password-file /tmp/vault-password \
            ansible/deploy.yml