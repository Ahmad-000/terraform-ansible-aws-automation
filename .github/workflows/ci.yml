name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm run build

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ahmad459/mern-boilerplate-frontend:latest
            ahmad459/mern-boilerplate-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ahmad459/mern-boilerplate-backend:latest
            ahmad459/mern-boilerplate-backend:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx rsync
          pipx install --include-deps ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install ansible.posix community.docker

      - name: Prepare deployment credentials
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

          printf '%s' "$ANSIBLE_VAULT_FILE" > ansible/vault.yml
          chmod 600 ansible/vault.yml

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > /tmp/vault-password
          chmod 600 /tmp/vault-password

          printf '[mern_servers]\n%s ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/ec2_key\n' \
            "$EC2_HOST" > /tmp/inventory.ini

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Diagnose EC2 SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Checking EC2 host..."
          getent hosts "$EC2_HOST" || true

          echo "Checking SSH port 22..."
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22"; then
            echo "SSH port 22 is reachable from GitHub Actions."
          else
            echo "SSH port 22 is NOT reachable from GitHub Actions."
            exit 1
          fi

      - name: Verify SSH connection
        run: |
          ansible mern_servers \
            -i /tmp/inventory.ini \
            -m ansible.builtin.ping

      - name: Deploy application
        run: |
          ansible-playbook \
            -i /tmp/inventory.ini \
            --vault-password-file /tmp/vault-password \
            ansible/deploy.yml
